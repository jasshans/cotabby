# Build Ghostype and publish it to the floating `stable` release.
#
# Every push to main produces a signed-for-Sparkle `Ghostype.zip` plus a fresh
# `appcast.xml`, both attached to the floating GitHub release tagged `stable`.
# The app's SUFeedURL points at that release, so "Check for Updates" (menu bar
# and Settings > About) picks up each new build automatically.
#
# Versioning: each release build bumps the patch version in the VERSION file
# (0.1.0 -> 0.1.1 -> ...), committed back with [skip ci], so the marketing
# version visibly changes with every shipped update. CURRENT_PROJECT_VERSION
# is the GitHub run number, which always increases. Sparkle treats a higher
# build number as an update even when the marketing version is unchanged.
#
# Signing: ad-hoc by default (CODE_SIGN_IDENTITY="-"). No Apple Developer identity
# is needed. The update's integrity comes from the Sparkle EdDSA signature,
# not from code signing. Optionally, set the CODESIGN_P12_BASE64 /
# CODESIGN_P12_PASSWORD secrets (see scripts/setup-codesign.sh) to sign releases
# with a stable self-signed certificate instead — then macOS keeps Accessibility
# / Input Monitoring grants across updates instead of re-prompting every time.
#
# Required repository secret:
#   SPARKLE_ED25519_PRIVATE_KEY — the private half of the EdDSA keypair used
#   to sign updates. Generate it once on a Mac with Sparkle's `generate_keys`
#   tool (ships in the Sparkle release tarball / SPM artifact bundle):
#     1. run `generate_keys` and copy the printed keys,
#     2. paste the PUBLIC key into GhostypeInfo.plist's SUPublicEDKey,
#     3. paste the PRIVATE key into this secret.
#   Without the secret this workflow fails fast before the expensive build.
#
# Two deliberate deviations from a naive xcodebuild invocation:
#   - We build `-workspace build/cotabby-dependencies/Ghostype.xcworkspace`,
#     not `-project`, because the workspace pins the patched local
#     CotabbyInference checkout. A bare -project build would resolve
#     CotabbyInference from `branch: main` (unpinned, unpatched) and fail.
#   - We build the `Ghostype` (prod) scheme, not `Ghostype Dev`: the Dev
#     scheme sets GHOSTYPE_DEV, which compiles Sparkle out entirely, so the
#     shipped app would have a dead "Check for Updates" button.

name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while a release is building cancels the stale run; only the
# newest commit per ref ever publishes to `stable`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-publish:
    name: Build, sign, publish to stable
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # create/update the floating `stable` release
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: "0.1.0"
      WORKSPACE: build/cotabby-dependencies/Ghostype.xcworkspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast: without the private key we can neither sign the archive nor
      # produce an appcast the installed app would accept. No point burning
      # ~30 minutes of macOS runner time on a build we cannot ship.
      - name: Require Sparkle signing key
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}" ]]; then
            echo "::error::SPARKLE_ED25519_PRIVATE_KEY secret is not set."
            echo "Generate a keypair with Sparkle's generate_keys tool, put the public key" >&2
            echo "in GhostypeInfo.plist (SUPublicEDKey), and add the private key as the" >&2
            echo "SPARKLE_ED25519_PRIVATE_KEY repository secret. See the workflow header" >&2
            echo "and README for the full setup." >&2
            exit 1
          fi
          # The app refuses to start Sparkle while the placeholder is in place, so a
          # published build whose plist was never given the real public key could
          # never be picked up by "Check for Updates".
          if grep -q "REPLACE_WITH_GENERATED_SPARKLE_PUBLIC_ED_KEY" GhostypeInfo.plist; then
            echo "::error::GhostypeInfo.plist still has the SUPublicEDKey placeholder." >&2
            echo "Paste the public key from generate_keys into SUPublicEDKey and push again." >&2
            exit 1
          fi

      # Every release build bumps the patch version (0.1.0 -> 0.1.1 -> ...), so
      # the menu-bar version label and "Check for Updates" visibly change with
      # each shipped update. The bump is committed back with [skip ci] so the
      # VERSION file stays the single source of truth without retriggering CI.
      - name: Bump patch version
        run: |
          set -euo pipefail
          current="$(cat VERSION)"
          bumped="$(awk -F. -v OFS=. '{$NF += 1; print}' VERSION)"
          echo "Bumping marketing version: ${current} -> ${bumped}"
          echo "${bumped}" > VERSION
          echo "MARKETING_VERSION=${bumped}" >> "${GITHUB_ENV}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${bumped} [skip ci]"
          git push origin HEAD:main

      # Same Xcode pin policy as the Build workflow: runner images drift their
      # default Xcode without notice, so pin explicitly.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Regenerate Xcode project
        run: xcodegen generate

      # Must run after `xcodegen generate`: create-inference-workspace.py
      # requires Ghostype.xcodeproj to exist (it references it in the
      # generated workspace), and the .xcodeproj is not committed.
      - name: Prepare matching inference dependency
        run: scripts/prepare_cotabby_workspace.sh

      # Optional stable signing identity: if the CODESIGN_P12_BASE64 secret is set (see
      # scripts/setup-codesign.sh), import it into a throwaway keychain and sign this
      # release with it. A stable certificate gives the app a stable designated
      # requirement, so macOS keeps Accessibility / Input Monitoring grants across
      # updates. Without the secret we fall back to ad-hoc signing (grants reset
      # on every update, as before).
      - name: Import signing certificate (if configured)
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CODESIGN_P12_BASE64}" ]]; then
            echo "No signing certificate configured; falling back to ad-hoc signing."
            exit 0
          fi
          if [[ -z "${CODESIGN_P12_PASSWORD}" ]]; then
            echo "::error::CODESIGN_P12_BASE64 is set but CODESIGN_P12_PASSWORD is missing." >&2
            exit 1
          fi
          echo "${CODESIGN_P12_BASE64}" | base64 --decode > build/codesign.p12
          SIGN_KEYCHAIN="${RUNNER_TEMP}/ghostype-signing.keychain-db"
          SIGN_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${SIGN_KEYCHAIN_PASSWORD}" "${SIGN_KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${SIGN_KEYCHAIN}"
          security unlock-keychain -p "${SIGN_KEYCHAIN_PASSWORD}" "${SIGN_KEYCHAIN}"
          security import build/codesign.p12 -k "${SIGN_KEYCHAIN}" \
            -P "${CODESIGN_P12_PASSWORD}" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${SIGN_KEYCHAIN_PASSWORD}" "${SIGN_KEYCHAIN}" >/dev/null 2>&1 || true
          security list-keychains -d user -s "${SIGN_KEYCHAIN}" \
            $(security list-keychains -d user | tr -d '"')
          echo "GHOSTYPE_SIGN_IDENTITY=Ghostype Signing" >> "${GITHUB_ENV}"
          shred -u build/codesign.p12 2>/dev/null || rm -f build/codesign.p12
          echo "Signing certificate imported; releases will use the stable identity."

      - name: Build Release
        run: |
          set -euo pipefail
          # Stable cert identity when configured, ad-hoc ("-") otherwise.
          SIGN_IDENTITY="${GHOSTYPE_SIGN_IDENTITY:--}"
          echo "Signing with identity: ${SIGN_IDENTITY}"
          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme Ghostype \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGN_IDENTITY}" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            build

      - name: Re-sign embedded frameworks
        run: |
          set -euo pipefail
          SIGN_IDENTITY="${GHOSTYPE_SIGN_IDENTITY:--}"
          APP="build/DerivedData/Build/Products/Release/Ghostype.app"
          # Sparkle ships pre-signed with its own Team ID, but dyld requires
          # embedded frameworks to match the main executable's Team ID
          # (ad-hoc here, or the stable cert when configured). Re-sign every
          # bundled framework with the same identity, then re-seal the app.
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" | while read -r fw; do
            codesign --force --sign "${SIGN_IDENTITY}" "$fw"
          done
          codesign --force --sign "${SIGN_IDENTITY}" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Zip the app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Release/Ghostype.app" \
            "build/Ghostype.zip"
          ls -la build/Ghostype.zip

      # The Sparkle SPM artifact bundle ships sign_update; resolve the exact
      # tool that matches the Sparkle version the app just built against, so
      # the tools can never drift from the linked framework.
      - name: Locate Sparkle sign_update
        id: sparkle-tools
        run: |
          set -euo pipefail
          sign_update="$(find build/DerivedData/SourcePackages/artifacts \
            -path '*Sparkle/bin/sign_update' -type f 2>/dev/null | head -1)"
          if [[ -z "${sign_update}" ]]; then
            echo "::error::Could not find Sparkle's sign_update under build/DerivedData/SourcePackages/artifacts." >&2
            exit 1
          fi
          echo "sign-update=${sign_update}" >> "${GITHUB_OUTPUT}"
          echo "Using sign_update: ${sign_update}"

      - name: Write Sparkle private key to file
        run: |
          set -euo pipefail
          mkdir -p build/sparkle
          printf '%s' "${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}" > build/sparkle/ed25519.key
          chmod 600 build/sparkle/ed25519.key

      - name: Generate appcast.xml
        run: |
          set -euo pipefail
          python3 scripts/generate_appcast.py \
            --release-version "${MARKETING_VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --archive "build/Ghostype.zip" \
            --archive-filename "Ghostype.zip" \
            --output "build/appcast.xml" \
            --release-tag "stable" \
            --app-name "Ghostype" \
            --github-owner "jasshans" \
            --github-repository "cotabby" \
            --release-notes-base-url "https://github.com/jasshans/cotabby/releases" \
            --sign-update-tool "${{ steps.sparkle-tools.outputs.sign-update }}" \
            --ed-key-file "build/sparkle/ed25519.key"

      - name: Publish to floating stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view stable >/dev/null 2>&1; then
            gh release upload stable build/Ghostype.zip build/appcast.xml --clobber
          else
            gh release create stable build/Ghostype.zip build/appcast.xml \
              --title "Ghostype (stable channel)" \
              --notes "Floating release feeding Sparkle auto-updates. Rebuilt on every push to main." \
              --latest=false
          fi
          echo "Published:"
          gh release view stable --json assets --jq '.assets[].name'

      - name: Clean up key material and build cache
        if: always()
        run: rm -rf build/sparkle build/DerivedData
